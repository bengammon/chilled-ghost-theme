name: Deploy Theme
on:
  push:
    branches:
      - master
      - main
  # Pull requests (including Renovate's) get the build and gscan as a check,
  # but never the deploy job or its secrets.
  pull_request:

# Read-only token by default; no job here needs to write to the repo.
permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the one in flight.
# Pull requests get their own group per PR, and a newer push cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy-theme' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs (tag in the comment) so a moved or
# compromised tag cannot change what runs alongside the Ghost Admin API key.
jobs:
  # Installs and runs the npm toolchain. Has no access to the Ghost secrets, so
  # a malicious dependency here cannot reach the Admin API key.
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        # No dependency needs an install script (only the macOS-only fsevents
        # has one), so none get to run arbitrary code at install time.
        run: npm ci --ignore-scripts
      - name: Build production assets
        run: npm run build
      - name: Check theme with gscan
        # gscan is fetched at run time, not in devDependencies.
        run: npx --yes gscan@6.7.0 .
      - name: Upload theme
        if: github.event_name == 'push'
        # Only what Ghost needs: tools/hevy, CI config and sources of the
        # build toolchain stay out of the deployed theme.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme
          if-no-files-found: error
          retention-days: 7
          path: |
            *.hbs
            partials/
            members/
            assets/
            package.json
            LICENSE

  # Holds the Admin API key, and runs nothing from npm: it only zips the built
  # theme and uploads it.
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: theme
          path: theme
      - name: Deploy Ghost Theme
        uses: TryGhost/action-deploy-theme@b1ff2a5eeac1d5438a0aab35eb996fe4010d889e # v2.0.4
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          working-directory: theme
          theme-name: chilled-ghost-theme
